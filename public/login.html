<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Login</title>
  <link rel="stylesheet" href="./css/login.css">
</head>
<body>
  <main class="glass-card" aria-labelledby="loginTitle">
    <div class="logo">
      <!-- <div class="mark">L</div> -->
      <div>
        <h1 id="loginTitle">Sign in</h1>
        <!-- <p>Sign in to continue</p> -->
      </div>
    </div>

    <div id="msg" role="status" aria-live="polite" style="display:none"></div>

    <form id="loginForm" novalidate>
      <div>
        <label for="username">Username</label>
        <div class="input-wrap">
          <input id="username" name="username" type="text" autocomplete="username" placeholder="your.username" required autofocus />
        </div>
      </div>

      <div>
        <label for="password">Password</label>
        <div class="input-wrap">
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="••••••••" required />
          <button type="button" class="toggle-pass" aria-label="Toggle password" id="togglePass">Show</button>
        </div>
      </div>

      <div class="actions">
        <label class="remember">
          <input id="remember" name="remember" checked type="checkbox" style="accent-color: #67e8f9;" />
          Remember
        </label>
        <button class="btn" type="submit">Sign in</button>
      </div>

      <div class="hint">Security Tip: This is a secure login page. Please do not share your credentials with anyone.</div>
    </form>
  </main>
</body>
</html>

<script src="js/login.js"></script>
